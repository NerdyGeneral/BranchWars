name: Branch Wars checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    # The completed V2 source gate exceeded 15 minutes on hosted Linux (run21).
    # Retain every regression; allow the expanded suite to finish.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node game/tools/check.js

  full-windows:
    runs-on: windows-latest
    # Run21 took 14.4 minutes for work taking 5.6 locally (~2.6x).
    # The 27-minute local regression plus campaign audit needs hosted headroom.
    # Keep every gate and its per-test timeout; permit the evidence upload.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node game/tools/check.js --full
      - name: Keep regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-regression-evidence
          path: game/reports/baselines/*.json
          retention-days: 7
