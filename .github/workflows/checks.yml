name: Branch Wars checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node tools/check-release-catalog.js
      - run: node tools/check-release-catalog.test.js

  fast:
    runs-on: ubuntu-latest
    # Keep existing check names and shard membership. Heavy shard 5 runs in
    # three timing-balanced jobs below; no test commands are removed.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # integrated_staffing, facility_staff_planning and commercial_opportunity
          # replay frozen builds read with git show from main's history (~38MB).
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node game/tools/check.js --shard=${{ matrix.shard }}/8

  fast_five_parts:
    name: fast (5.${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node game/tools/check.js --shard=5/8 --partition=${{ matrix.part }}/3

  fast_five_gate:
    # Preserve the original status name for existing branch protection rules.
    name: fast (5)
    needs: fast_five_parts
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all three parts to pass
        env:
          PARTS_RESULT: ${{ needs.fast_five_parts.result }}
        run: node -e "if (process.env.PARTS_RESULT !== 'success') process.exit(1)"
