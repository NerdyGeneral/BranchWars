name: Branch Wars checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node tools/check-release-catalog.js
      - run: node tools/check-release-catalog.test.js

  fast:
    runs-on: ubuntu-latest
    # V4 grew the fast gate to 278 commands, roughly three sequential hours, so
    # one runner cannot finish inside a job limit. Each shard runs every eighth
    # command on its own runner (no shared output files) and every shard also
    # proves the portable build matches source. The gate passes only when all
    # eight shards pass; fail-fast is off so every shard reports. The slowest
    # shard took 56 minutes on its first green run (integrated_staffing alone
    # is ~13), so allow 90 rather than fail a passing shard on runner speed.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # integrated_staffing, facility_staff_planning and commercial_opportunity
          # replay frozen builds read with git show from main's history (~38MB).
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node game/tools/check.js --shard=${{ matrix.shard }}/8
